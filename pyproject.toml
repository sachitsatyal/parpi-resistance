[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "parpi-resistance"
version = "0.1.0"
description = "Reproducible single-cell models of PARP-inhibitor resistance and dose response in ovarian and breast cancer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Supriya" }, { name = "Sachit Satyal" }]
keywords = ["single-cell", "scRNA-seq", "PARP inhibitor", "olaparib", "drug resistance", "ovarian cancer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "click>=8.1",
  "joblib>=1.3",
  "requests>=2.31",
]

[project.optional-dependencies]
# Reading/writing .h5ad and 10x .h5 files
io = ["anndata>=0.10", "h5py>=3.10"]
# Hierarchical pathway-attention network
torch = ["torch>=2.2"]
# Optional experiment tracking
track = ["mlflow>=2.10"]
# Hugging Face Space / Hub
app = ["gradio>=4.30", "huggingface_hub>=0.23", "matplotlib>=3.8"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pandas-stubs",
  "types-PyYAML",
  "types-requests",
]
all = ["parpi-resistance[io,torch,track,app]"]

[project.scripts]
parpi = "parpi.cli:main"

[project.urls]
Repository = "https://github.com/sachitsatyal/parpi-resistance"

[tool.hatch.build.targets.wheel]
packages = ["src/parpi"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PT"]
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003"]  # X/G/K are conventional matrix names

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src/parpi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "torch: tests that need PyTorch",
  "network: tests that need internet access",
]

[tool.coverage.run]
source = ["parpi"]
branch = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT018"]

# CPU-only PyTorch wheels on Linux (CI, Docker, Hugging Face Space): ~10x smaller
# than the CUDA build. For GPU training, install torch from the CUDA index instead.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
