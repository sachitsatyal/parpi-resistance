# Pre-registered multi-line round (2026-11-03), variant B.
# Train on Kuramochi + COV362 + OVSAHO; select by leave-one-cell-line-out CV.
# PDX is deliberately NOT included here: it is evaluated once, after selection.
project: parpi-resistance
data_dir: data
output_dir: outputs/multiline_b
processed_dir: outputs/multiline_b/processed
includes:
  - datasets/kuramochi_gse206125.yaml
  - datasets/cov362_ovsaho_gse247689.yaml
  - datasets/kuramochi_10x_gse247688.yaml
features:
  gene_sets: "enrichr:MSigDB_Hallmark_2020+enrichr:Reactome_2022"
  min_set_size: 10
  max_set_size: 300
  min_gene_coverage: 0.6
  # Variant B: drop generic biosynthesis / proliferation programmes, the axis that
  # dominated the Kuramochi dose signal and the vehicle-vs-vehicle PDX difference.
  # DNA replication and repair pathways are deliberately kept (PARPi biology).
  exclude_gene_sets:
    - "ribosom"
    - '\btranslation\b'   # not post-translational modification
    - "peptide chain elongation"
    - "nonsense.mediated decay"
    - "selenoamino acid"
    - "srp-dependent"
    - "rrna"
    - "influenza"
    - "sars-cov"
    - "myc targets"
    - "e2f targets"
    - "g2-m checkpoint"
    - "mitotic"
split:
  strategy: leave_dataset_out
train:
  # HGB dropped this round: trees cannot extrapolate to unseen doses/lines.
  models: [ridge, hierarchical]
  ensemble_size: 3
  seed: 42
  hierarchical: {epochs: 25, patience: 4, heads: 2, dim: 32, batch_size: 512}
