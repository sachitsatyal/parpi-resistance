name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true, python-version: "3.12" }
      - run: uv lock --check            # uv.lock must match pyproject.toml
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests app
      - run: uv run ruff format --check src tests app
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true, python-version: "${{ matrix.python }}" }
      - run: uv sync --locked --all-extras
      - name: Unit + integration tests (incl. PyTorch model)
        run: uv run pytest --cov --cov-report=xml --cov-report=term -m "not network"
      - name: Smoke pipeline on synthetic data + release gate
        run: |
          uv run parpi reproduce -c configs/smoke.yaml
          uv run parpi gate -c configs/smoke.yaml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: smoke-outputs
          path: .smoke/outputs
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: parpi-resistance:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: |
          docker run --rm parpi-resistance:ci parpi --help
          docker run --rm parpi-resistance:ci python -c "import parpi, torch, gradio, anndata; print('ok')"
