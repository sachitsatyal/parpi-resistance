name: Release

# Tag a commit `vX.Y.Z` to retrain from scratch, enforce the quality gate, and
# publish: model -> Hugging Face Hub, image -> GHCR, app -> Hugging Face Space.
#
# Repository settings needed:
#   secrets.HF_TOKEN          write token for the Hub
#   vars.HF_MODEL_REPO        e.g. your-org/parpi-resistance
#   vars.HF_SPACE_REPO        e.g. your-org/parpi-resistance-app
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  train-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      model: ${{ steps.sel.outputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true, python-version: "3.12" }
      - run: uv sync --locked --all-extras
      - uses: actions/cache@v6
        with:
          path: |
            data/raw
            data/genesets
          key: geo-${{ hashFiles('configs/datasets/**') }}
      - run: uv run pytest -q -m "not network"
      - run: uv run parpi prepare -c configs/default.yaml
      - run: uv run parpi train -c configs/default.yaml
      - run: uv run parpi evaluate -c configs/default.yaml
      - run: uv run parpi report -c configs/default.yaml --hf-repo "${{ vars.HF_MODEL_REPO }}"
      - name: Quality gate (blocks the release)
        run: uv run parpi gate -c configs/default.yaml
      - id: sel
        run: echo "model=$(cat outputs/models/SELECTED)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: release-outputs, path: outputs }

  publish-model:
    needs: train-and-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync --locked --extra app
      - uses: actions/download-artifact@v4
        with: { name: release-outputs, path: outputs }
      - name: Push model bundle to the Hub (tagged with the release version)
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: >
          uv run parpi push -m outputs/models/${{ needs.train-and-gate.outputs.model }}
          --repo "${{ vars.HF_MODEL_REPO }}" --revision-tag "${{ github.ref_name }}"
      - name: GitHub release with metrics
        uses: softprops/action-gh-release@v2
        with:
          files: |
            outputs/metrics/cv.json
            outputs/metrics/external.json
            outputs/metrics/dose_response_loo.csv
            outputs/models/${{ needs.train-and-gate.outputs.model }}/README.md

  publish-image:
    needs: train-and-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-space:
    needs: [publish-model, publish-image]
    runs-on: ubuntu-latest
    environment: huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv pip install --system "huggingface_hub>=0.23"
      - env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: >
          python scripts/deploy_space.py --space "${{ vars.HF_SPACE_REPO }}"
          --model "hf://${{ vars.HF_MODEL_REPO }}@${{ github.ref_name }}"
